<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
  
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background-color: #e0ece3;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    background: #ffffff;
    width: 100%;
    max-width: 520px;
    border-radius: 16px;
    padding: 32px 30px 28px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.04);
  }

  h1 {
    font-size: 20px;
    font-weight: 700;
    color: #2a3c34;
    margin-bottom: 22px;
    letter-spacing: -0.2px;
  }

  label {
    display: block;
    font-size: 11px;
    font-weight: 500;
    color: #4a5a53;
    margin-bottom: 6px;
    letter-spacing: 0.2px;
  }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }

  .field {
    margin-bottom: 16px;
  }

  input[type="text"],
  input[type="email"],
  textarea {
    width: 100%;
    border: 1.5px solid #d9dfdb;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    outline: none;
    transition: all 0.2s;
    color: #2a3c34;
    background: #fff;
  }

  textarea {
    height: 90px;
    resize: none;
  }

  input:focus, textarea:focus {
    border-color: #1a6b5a;
    box-shadow: 0 0 0 3px rgba(26,107,90,0.08);
  }

  .error { border-color: #d94040 !important; }
  .error-text {
    font-size: 11px;
    color: #d94040;
    margin-top: 5px;
    display: none;
  }
  .error-text.show { display: block; }

  /* Query Type */
  .query-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .radio-card {
    border: 1.5px solid #d9dfdb;
    border-radius: 8px;
    padding: 11px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 13px;
    color: #2a3c34;
  }

  .radio-card.active {
    border-color: #1a6b5a;
    background: #eaf4f0;
  }

  .radio-card input {
    accent-color: #1a6b5a;
    width: 14px;
    height: 14px;
  }

  /* Consent */
  .consent {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin: 18px 0 20px;
    cursor: pointer;
  }

  .consent input {
    margin-top: 2px;
    accent-color: #1a6b5a;
    width: 14px;
    height: 14px;
  }

  .consent span {
    font-size: 11px;
    color: #4a5a53;
    line-height: 1.4;
  }

  /* Button */
  button {
    width: 100%;
    background: #0f6a5b;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 13px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    letter-spacing: 0.2px;
  }

  button:hover { background: #0d5a4d; }
  button:active { transform: scale(0.99); }

  .success {
    display: none;
    text-align: center;
    padding: 20px 0 10px;
  }
  .success.show { display: block; }
  .success h2 { color: #0f6a5b; font-size: 18px; margin-bottom: 8px; }
  .success p { font-size: 13px; color: #4a5a53; }

  /* Mobile Responsive */
  @media (max-width: 480px) {
    .card { padding: 24px 20px; border-radius: 12px; }
    .row, .query-group { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="card" id="formCard">
  <h1>Contact Us</h1>

  <form id="contactForm" novalidate>
    <div class="row">
      <div class="field">
        <label>First Name *</label>
        <input type="text" id="firstName">
        <div class="error-text" id="firstNameError">This field is required</div>
      </div>
      <div class="field">
        <label>Last Name *</label>
        <input type="text" id="lastName">
        <div class="error-text" id="lastNameError">This field is required</div>
      </div>
    </div>

    <div class="field">
      <label>Email Address *</label>
      <input type="email" id="email">
      <div class="error-text" id="emailError">Please enter a valid email address</div>
    </div>

    <div class="field">
      <label>Query Type *</label>
      <div class="query-group" id="queryGroup">
        <label class="radio-card" id="cardGeneral">
          <input type="radio" name="query" value="General Enquiry"> General Enquiry
        </label>
        <label class="radio-card" id="cardSupport">
          <input type="radio" name="query" value="Support Request"> Support Request
        </label>
      </div>
      <div class="error-text" id="queryError">Please select a query type</div>
    </div>

    <div class="field">
      <label>Message *</label>
      <textarea id="message"></textarea>
      <div class="error-text" id="messageError">This field is required</div>
    </div>

    <label class="consent">
      <input type="checkbox" id="consent">
      <span>I consent to being contacted by the team *</span>
    </label>
    <div class="error-text" id="consentError" style="margin-top:-12px; margin-bottom:16px;">To submit this form, please consent to being contacted</div>

    <button type="submit">Submit</button>
  </form>

  <div class="success" id="successMsg">
    <h2>Message Sent!</h2>
    <p>Thanks for completing the form. We'll be in touch soon!</p>
  </div>
</div>

<script>
  const form = document.getElementById('contactForm');
  const cards = document.querySelectorAll('.radio-card');
  const inputs = form.querySelectorAll('input[type="radio"]');

  // Radio card active state
  inputs.forEach(radio => {
    radio.addEventListener('change', () => {
      cards.forEach(c => c.classList.remove('active'));
      if(radio.checked) {
        radio.closest('.radio-card').classList.add('active');
      }
    });
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    let valid = true;

    const firstName = document.getElementById('firstName');
    const lastName = document.getElementById('lastName');
    const email = document.getElementById('email');
    const message = document.getElementById('message');
    const consent = document.getElementById('consent');
    const querySelected = document.querySelector('input[name="query"]:checked');

    // reset
    document.querySelectorAll('.error-text').forEach(el => el.classList.remove('show'));
    document.querySelectorAll('input, textarea').forEach(el => el.classList.remove('error'));

    if(!firstName.value.trim()){ firstName.classList.add('error'); document.getElementById('firstNameError').classList.add('show'); valid=false; }
    if(!lastName.value.trim()){ lastName.classList.add('error'); document.getElementById('lastNameError').classList.add('show'); valid=false; }
    if(!email.value.trim() || !/^\S+@\S+\.\S+$/.test(email.value)){ email.classList.add('error'); document.getElementById('emailError').classList.add('show'); valid=false; }
    if(!querySelected){ document.getElementById('queryError').classList.add('show'); valid=false; }
    if(!message.value.trim()){ message.classList.add('error'); document.getElementById('messageError').classList.add('show'); valid=false; }
    if(!consent.checked){ document.getElementById('consentError').classList.add('show'); valid=false; }

    if(valid){
      form.style.display = 'none';
      document.getElementById('successMsg').classList.add('show');
    }
  });
</script>

</body>
</html>
